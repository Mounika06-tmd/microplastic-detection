<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - Microplastic Detection</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body class="auth-page">

    <!-- NAVBAR -->
    <header class="navbar">

        <!-- Home Logo -->
        <a href="/" class="logo">
            🧪 <span>Microplastic Detection</span>
        </a>

        <div class="nav-buttons">

            <!-- IMPORTANT: Home goes to Flask "/" route -->
                 <a href="/index.html" class="btn btn-outline">
    Home
</a>

            <a href="/signup.html" class="btn btn-primary">
                Sign Up
            </a>

        </div>

    </header>


    <!-- SIGN IN -->
    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    🧪
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Sign in to continue to Microplastic Detection
                </p>

            </div>


            <form id="signinForm">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="signinEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signinEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="signinPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signinPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- MESSAGE -->
                <div
                    id="signinMessage"
                    class="auth-message"
                    style="display:none;"
                ></div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Sign In
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="/signup.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <p>
            © 2026 Microplastic Detection.
            All rights reserved.
        </p>

    </footer>


    <script>

        /* ================================
           PASSWORD SHOW / HIDE
        ================================= */

        function togglePassword() {

            const password =
                document.getElementById("signinPassword");

            const button =
                document.querySelector(".password-toggle");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "🙈";

            } else {

                password.type = "password";
                button.textContent = "👁";

            }

        }


        /* ================================
           SHOW MESSAGE
        ================================= */

        function showMessage(message, type) {

            const messageBox =
                document.getElementById("signinMessage");

            messageBox.textContent = message;

            messageBox.style.display = "block";

            messageBox.className =
                "auth-message " + type;

        }


        /* ================================
           SIGN IN
        ================================= */

        document
            .getElementById("signinForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("signinEmail").value.trim();

                const password =
                    document.getElementById("signinPassword").value;


                if (!email || !password) {

                    showMessage(
                        "Please enter email and password.",
                        "error"
                    );

                    return;
                }


                const submitButton =
                    document.querySelector(".auth-submit");

                submitButton.disabled = true;

                submitButton.textContent = "Signing In...";


                try {

                    const response = await fetch("/api/signin", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })

                    });


                    const data = await response.json();


                    if (response.ok && data.success) {

                        // Store user information if returned
                        if (data.user) {

                            localStorage.setItem(
                                "user",
                                JSON.stringify(data.user)
                            );

                        }

                        showMessage(
                            "Login successful! Redirecting...",
                            "success"
                        );


                        setTimeout(function() {

                            window.location.href =
                                "/dashboard.html";

                        }, 500);

                    } else {

                        showMessage(
                            data.message ||
                            "Invalid email or password.",
                            "error"
                        );

                        submitButton.disabled = false;

                        submitButton.textContent = "Sign In";

                    }

                } catch (error) {

                    console.error("Sign in error:", error);

                    showMessage(
                        "Unable to connect to server. Please try again.",
                        "error"
                    );

                    submitButton.disabled = false;

                    submitButton.textContent = "Sign In";

                }

            });
                            function goHome() {
                    window.location.replace("/");
                }

    </script>

</body>
</html>
